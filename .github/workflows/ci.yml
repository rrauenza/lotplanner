name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # `setup-node` guarantees Node and npm, not Yarn, so Yarn is ensured here
      # rather than assumed from the runner image.
      - name: Ensure Yarn
        run: yarn --version || npm install --global yarn@1.22.22

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Unit tests
        run: yarn test

      - name: Install a browser
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn test:e2e

      # The same hooks a contributor gets locally, so the hook configuration
      # cannot rot unnoticed.
      - name: Pre-commit hooks
        run: pipx run pre-commit run --all-files

      - name: Build
        run: yarn build

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `enablement` lets the workflow turn Pages on for the repository itself,
      # so the first push after this lands deploys without a manual step.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
